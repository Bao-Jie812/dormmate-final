<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DormMate - Web 主应用</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="dormmate-card">
    <h1>DormMate</h1>
    <p class="subtitle">宿舍环境助手 · M1 Web 主应用</p>

    <section class="node-area">
      <label for="nodeSelect">选择宿舍</label>
      <select id="nodeSelect">
        <option value="dorm-a" selected>dorm-a</option>
        <option value="dorm-b">dorm-b</option>
        <option value="dorm-c">dorm-c</option>
      </select>
    </section>

    <section class="input-area">
      <label>
        温度（℃）
        <input type="number" id="temperatureInput" placeholder="例如 31" step="0.1" />
      </label>

      <label>
        湿度（%）
        <input type="number" id="humidityInput" placeholder="例如 78" step="0.1" />
      </label>

      <button id="analyzeBtn">分析环境</button>
    </section>

    <section class="result-area">
      <h2>当前结果</h2>
      <span id="statusText" class="status-block">尚未分析</span>
      <p id="adviceText">请输入温湿度后点击“分析环境”。</p>
      <p id="mqttStatus" style="font-size: 13px; color: #d97706; margin-top: 12px;">MQTT：未连接</p>
    </section>

    <section class="history-area">
      <h2>历史记录</h2>
      <ul id="historyList"></ul>
    </section>

    <section class="export-area" style="margin-top: 24px;">
        <button id="exportBtn">导出 CSV</button>
    </section>

    <section class="camera-area" style="margin-top: 24px;">
    <h2>现场快照</h2>
    <button id="cameraBtn">拍照并记录现场</button>
    <div style="margin-top: 12px;">
        <video id="cameraPreview" autoplay playsinline style="max-width: 100%; display: none;"></video>
        <canvas id="cameraCanvas" style="display: none;"></canvas>
        <img id="snapshotImg" alt="现场快照" style="max-width: 100%; display: none;" />
    </div>
    </section>

    <section class="spot-area" style="margin-top: 24px;">
    <h2>现场记录</h2>
    <ul id="spotLogList" class="spot-log"></ul>
    </section>

    <section class="voice-area" style="margin-top: 24px;">
    <h2>语音交互</h2>
    <button id="asrBtn">开始语音识别</button>
    <button id="ttsBtn">朗读当前状态</button>
    <p id="asrResult">识别结果：暂无</p>
    </section>
  </main>

  <!-- 引入 mqtt.js（与 dashboard / 3d 使用同一 CDN 版本），必须在 script.js 之前 -->
  <script src="https://cdn.bootcdn.net/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
